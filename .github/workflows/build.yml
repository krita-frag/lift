name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y tcl-tk tk

      - name: Install uv
        run: |
          curl -sSL https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Python via uv
        run: uv python install 3.11

      - name: Install Zig
        run: |
          curl -sSL https://ziglang.org/download/0.16.0/zig-linux-x86_64-0.16.0.tar.xz | tar -xJ
          mv zig-linux-x86_64-0.16.0 /opt/zig
          echo "/opt/zig" >> $GITHUB_PATH

      - name: Build
        run: |
          uv sync
          uv run build.py

      - name: Verify build
        run: |
          ls -la dist/bin/
          file dist/bin/lift

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          Invoke-WebRequest -Uri "https://astral.sh/uv/install.sh" -OutFile "install-uv.sh"
          bash install-uv.sh

      - name: Install Python via uv
        run: uv python install 3.11

      - name: Install Zig
        run: |
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.16.0/zig-windows-x86_64-0.16.0.zip" -OutFile "zig.zip"
          Expand-Archive -Path "zig.zip" -DestinationPath "C:\"
          echo "C:\zig-windows-x86_64-0.16.0" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        run: |
          uv sync
          uv run build.py

      - name: Verify build
        run: |
          dir dist\bin\
          Get-ChildItem dist\bin\
