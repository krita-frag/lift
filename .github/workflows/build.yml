name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update -y
          apt-get install -y tcl-tk tk

      - name: Install uv
        run: |
          curl -sSL https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Python via uv
        run: |
          source $GITHUB_PATH 2>/dev/null || true
          uv python install 3.11

      - name: Install Zig 0.16.0
        run: |
          curl -sSL https://ziglang.org/download/0.16.0/zig-linux-x86_64-0.16.0.tar.xz | tar -xJ
          sudo mv zig-linux-x86_64-0.16.0 /opt/zig
          echo "/opt/zig" >> $GITHUB_PATH

      - name: Build with explicit Zig path
        run: |
          export PATH="/opt/zig:$HOME/.cargo/bin:$PATH"
          which zig
          zig version
          uv sync
          uv run build.py

      - name: Verify build
        run: |
          ls -la dist/bin/
          file dist/bin/lift

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          $env:Path = "$env:LOCALAPPDATA\uv\bin;$env:Path"
          Invoke-WebRequest -Uri "https://astral.sh/uv/install.ps1" -OutFile "install-uv.ps1"
          powershell -ExecutionPolicy Bypass -File "install-uv.ps1"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:LOCALAPPDATA\uv\bin"

      - name: Install Python via uv
        run: |
          uv python install 3.11

      - name: Install Zig 0.16.0
        run: |
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.16.0/zig-windows-x86_64-0.16.0.zip" -OutFile "zig.zip"
          Expand-Archive -Path "zig.zip" -DestinationPath "C:\"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\zig-windows-x86_64-0.16.0"

      - name: Build
        run: |
          uv sync
          uv run build.py

      - name: Verify build
        run: |
          dir dist\bin\
          Get-ChildItem dist\bin\
